<!-- updated -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS — AD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050810;--surface:#0a0f1e;--border:#1a2440;--accent:#00d4ff;--accent2:#ff6b00;--green:#00ff88;--red:#ff2244;--text:#c8d8f0;--muted:#3a5070}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;letter-spacing:0.2em;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:all 0.3s}
#status-dot.ready{background:var(--green);box-shadow:0 0 8px var(--green)}
#status-dot.thinking{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 0.8s ease infinite}
#status-dot.speaking{background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:blink 0.5s ease infinite}
#status-dot.listening{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 0.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#status-label{font-size:9px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-right:8px;transition:color 0.3s}
#viewfinder{position:relative;flex:1;overflow:hidden;background:#000;min-height:0}
#camera-feed{width:100%;height:100%;object-fit:cover;opacity:0.8}
#canvas{display:none}
.hud{position:absolute;inset:0;pointer-events:none}
.corner{position:absolute;width:24px;height:24px;border-color:var(--accent);border-style:solid;opacity:0.6}
.corner.tl{top:12px;left:12px;border-width:2px 0 0 2px}
.corner.tr{top:12px;right:12px;border-width:2px 2px 0 0}
.corner.bl{bottom:12px;left:12px;border-width:0 0 2px 2px}
.corner.br{bottom:12px;right:12px;border-width:0 2px 2px 0}
#scanline{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.25;animation:scan 4s ease-in-out infinite}
@keyframes scan{0%{top:12px}50%{top:calc(100% - 12px)}100%{top:12px}}
#flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity 0.4s}
#flash.pop{opacity:0.5;transition:opacity 0.05s}
#no-camera{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#no-camera h3{font-family:'Orbitron',monospace;color:var(--accent);font-size:14px;letter-spacing:0.1em}
#no-camera p{color:var(--muted);font-size:11px;line-height:1.7}
#response-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(5,8,16,0.97),rgba(5,8,16,0.85));border-top:1px solid var(--border);padding:14px 16px;max-height:45%;overflow-y:auto;transform:translateY(100%);transition:transform 0.25s ease}
#response-panel.open{transform:translateY(0)}
#response-tag{font-size:8px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#response-tag::after{content:'';flex:1;height:1px;background:var(--border)}
#response-text{font-size:13px;line-height:1.7;color:var(--text)}
#controls{background:var(--surface);border-top:1px solid var(--border);padding:10px 12px 16px;flex-shrink:0}
#input-row{display:flex;gap:8px;margin-bottom:8px}
#text-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;transition:border-color 0.2s}
#text-input::placeholder{color:var(--muted)}
#text-input:focus{border-color:var(--accent)}
#send-btn{background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:10px 16px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:0.1em;cursor:pointer;white-space:nowrap}
#send-btn:disabled{opacity:0.3}
#btn-row{display:flex;gap:8px}
.icon-btn{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 8px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;-webkit-tap-highlight-color:transparent}
.icon-btn.active-cam{border-color:var(--accent);color:var(--accent)}
.icon-btn.active-voice{border-color:var(--red);color:var(--red);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,34,68,0.4)}50%{box-shadow:0 0 0 6px rgba(255,34,68,0)}}
#apikey-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:20px;z-index:100}
.jarvis-logo{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:var(--accent);text-shadow:0 0 40px rgba(0,212,255,0.5);letter-spacing:0.2em;animation:logoGlow 3s ease infinite}
@keyframes logoGlow{0%,100%{text-shadow:0 0 40px rgba(0,212,255,0.5)}50%{text-shadow:0 0 60px rgba(0,212,255,0.9)}}
.tagline{font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;text-align:center}
#apikey-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:13px 16px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;text-align:center}
#apikey-input:focus{border-color:var(--accent)}
#apikey-submit{width:100%;background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:14px;font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:0.15em;cursor:pointer}
.key-note{font-size:10px;color:var(--muted);text-align:center;line-height:1.6}
.key-note a{color:var(--accent);text-decoration:none}
#forget-key{background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;cursor:pointer;text-decoration:underline;padding:4px}
</style>
</head>
<body>
<div id="apikey-screen">
  <div class="jarvis-logo">JARVIS</div>
  <div class="tagline">Atelier Domingue · Workshop AI</div>
  <div class="key-note">Enter your Anthropic API key.<br>It will be remembered on this device.</div>
  <input id="apikey-input" type="password" placeholder="sk-ant-..." autocomplete="off"/>
  <button id="apikey-submit" onclick="initJarvis()">INITIALIZE SYSTEM</button>
  <div class="key-note">Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></div>
</div>
<div id="app" style="display:none">
  <div id="header">
    <div class="logo">JARVIS <span>/ AD</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="forget-key" onclick="forgetKey()">RESET KEY</button>
      <div id="status-label">OFFLINE</div>
      <div id="status-dot"></div>
    </div>
  </div>
  <div id="viewfinder">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="scanline"></div>
    </div>
    <div id="flash"></div>
    <div id="no-camera">
      <h3>CAMERA OFFLINE</h3>
      <p>Tap the camera button below to activate your viewfinder.</p>
    </div>
    <div id="response-panel">
      <div id="response-tag">JARVIS</div>
      <div id="response-text"></div>
    </div>
  </div>
  <div id="controls">
    <div id="input-row">
      <input id="text-input" type="text" placeholder="Ask JARVIS anything..."/>
      <button id="send-btn" onclick="sendQuery()">SEND</button>
    </div>
    <div id="btn-row">
      <button class="icon-btn" id="cam-btn" onclick="toggleCamera()">📷 CAMERA</button>
      <button class="icon-btn" id="voice-btn" onclick="toggleVoice()">🎙 SPEAK</button>
      <button class="icon-btn" id="clear-btn" onclick="clearAll()">✕ CLEAR</button>
    </div>
  </div>
</div>
<script>
const KEY_STORAGE = 'jarvis_ad_api_key';
let apiKey='',capturedImage=null,stream=null,recognition=null,isListening=false,conversationHistory=[];

// Auto-load saved key on startup
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(KEY_STORAGE);
  if (saved) {
    apiKey = saved;
    showApp();
  }
  document.getElementById('text-input').addEventListener('keydown', e => {
    if(e.key==='Enter') sendQuery();
  });
});

function showApp() {
  document.getElementById('apikey-screen').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';app.style.flexDirection='column';app.style.height='100%';
  setStatus('READY','ready');
  speak('JARVIS online. Workshop systems ready.');
}

function initJarvis(){
  const val=document.getElementById('apikey-input').value.trim();
  if(!val.startsWith('sk-ant-')&&!val.startsWith('sk-')){alert('Please enter a valid Anthropic API key');return;}
  apiKey=val;
  localStorage.setItem(KEY_STORAGE, apiKey);
  showApp();
}

function forgetKey(){
  if(confirm('Remove saved API key?')){
    localStorage.removeItem(KEY_STORAGE);
    apiKey='';
    document.getElementById('app').style.display='none';
    document.getElementById('apikey-screen').style.display='flex';
    document.getElementById('apikey-input').value='';
  }
}

async function toggleCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;document.getElementById('camera-feed').srcObject=null;document.getElementById('cam-btn').classList.remove('active-cam');document.getElementById('cam-btn').textContent='📷 CAMERA';document.getElementById('no-camera').style.display='flex';return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    document.getElementById('camera-feed').srcObject=stream;
    document.getElementById('no-camera').style.display='none';
    document.getElementById('cam-btn').classList.add('active-cam');
    document.getElementById('cam-btn').textContent='📷 LIVE';
  }catch(e){alert('Camera access denied. Please allow camera access in Safari settings.');}
}

function captureFrame(){
  const video=document.getElementById('camera-feed');
  if(!stream||!video.videoWidth)return false;
  const canvas=document.getElementById('canvas');
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  capturedImage=canvas.toDataURL('image/jpeg',0.75).split(',')[1];
  const flash=document.getElementById('flash');
  flash.classList.add('pop');setTimeout(()=>flash.classList.remove('pop'),350);
  return true;
}

async function sendQuery(overrideText){
  const input=document.getElementById('text-input');
  const question=overrideText||input.value.trim();
  if(!question)return;
  setStatus('THINKING','thinking');
  document.getElementById('send-btn').disabled=true;
  captureFrame();
  const content=[];
  if(capturedImage){content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:capturedImage}});}
  content.push({type:'text',text:question});
  conversationHistory.push({role:'user',content});
  try{
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-opus-4-5',max_tokens:400,
        system:`You are JARVIS, personal AI assistant for Paul, General Manager of Atelier Domingue — a steel doors and windows fabrication shop. You have vision access through a camera. Be confident, precise, direct. Like Tony Stark's JARVIS — capable, calm, slightly dry humor. Keep responses concise — they will be read aloud. Focus on: weld quality, alignment, fabrication issues, material identification, equipment, measurements. Reference earlier conversation when relevant.`,
        messages:conversationHistory.map(m=>({role:m.role,content:m.content}))
      })
    });
    const data=await response.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.content[0].text;
    conversationHistory.push({role:'assistant',content:reply});
    if(conversationHistory.length>20)conversationHistory=conversationHistory.slice(-16);
    showResponse(reply);speak(reply);
    capturedImage=null;
    if(!overrideText)input.value='';
  }catch(err){showResponse('Error: '+err.message);setStatus('ERROR','');}
  finally{document.getElementById('send-btn').disabled=false;}
}

function showResponse(text){
  document.getElementById('response-text').textContent=text;
  document.getElementById('response-panel').classList.add('open');
  setStatus('READY','ready');
}

function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.rate=1.05;utter.pitch=0.9;
  const voices=window.speechSynthesis.getVoices();
  const pick=voices.find(v=>v.name.includes('Daniel')||v.name.includes('Samantha')||v.name.includes('Google'));
  if(pick)utter.voice=pick;
  utter.onstart=()=>setStatus('SPEAKING','speaking');
  utter.onend=()=>setStatus('READY','ready');
  window.speechSynthesis.speak(utter);
}

function toggleVoice(){
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){alert('Voice input requires Chrome. Type your question instead.');return;}
  if(isListening){recognition?.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-US';
  recognition.onstart=()=>{isListening=true;document.getElementById('voice-btn').classList.add('active-voice');document.getElementById('voice-btn').textContent='⏹ LISTENING';setStatus('LISTENING','listening');captureFrame();};
  recognition.onresult=(e)=>{const t=e.results[0][0].transcript;document.getElementById('text-input').value=t;sendQuery(t);};
  recognition.onend=()=>{isListening=false;document.getElementById('voice-btn').classList.remove('active-voice');document.getElementById('voice-btn').textContent='🎙 SPEAK';};
  recognition.onerror=()=>{isListening=false;document.getElementById('voice-btn').classList.remove('active-voice');document.getElementById('voice-btn').textContent='🎙 SPEAK';setStatus('READY','ready');};
  recognition.start();
}

function setStatus(label,type){document.getElementById('status-label').textContent=label;document.getElementById('status-dot').className=type;}

function clearAll(){capturedImage=null;conversationHistory=[];document.getElementById('response-panel').classList.remove('open');document.getElementById('text-input').value='';window.speechSynthesis?.cancel();setStatus('READY','ready');}

window.speechSynthesis?.addEventListener('voiceschanged',()=>{});
</script>
</body>
</html>
